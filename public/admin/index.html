<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c0f0e">
  <title></title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/monitorPages.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <a class="brand" href="/" aria-label="" id="brand-link">
        <span class="brand-mark">S</span>
        <span><strong id="brand-title"></strong><small id="brand-subtitle"></small></span>
      </a>
      <div class="header-tools">
        <a class="button button--quiet" href="/status/" id="public-status-link"></a>
        <button class="button button--quiet" id="refresh-button" type="button" hidden></button>
        <button class="button button--quiet" id="logout-button" type="button" hidden></button>
      </div>
    </header>

    <main class="main-content">
      <section class="login-panel panel" id="login-panel" hidden>
        <p class="eyebrow" id="login-kicker"></p>
        <h1 id="login-title"></h1>
        <p class="login-copy" id="login-copy"></p>
        <form id="login-form">
          <label class="field-label" for="password" id="password-label"></label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="button button--primary" type="submit" id="login-button"></button>
          <p class="form-message" id="login-message" role="status"></p>
        </form>
      </section>

      <section class="disabled-panel panel" id="disabled-panel" hidden>
        <p class="eyebrow" id="disabled-kicker"></p>
        <h1 id="disabled-title"></h1>
        <p class="login-copy" id="disabled-copy"></p>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="page-kicker"></p>
            <h1 id="page-title"></h1>
          </div>
          <div class="live-indicator" id="live-indicator" role="status" aria-live="polite"><span></span><strong id="live-label"></strong></div>
        </div>

        <nav class="page-navigation" id="admin-navigation" aria-label=""></nav>

        <section data-admin-page="updates" hidden class="update-panel panel" id="update-panel" aria-label="">
          <div class="update-panel__symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 18V5m0 0L7 10m5-5 5 5M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter"/></svg>
          </div>
          <div class="update-panel__content">
            <p class="eyebrow" id="update-kicker"></p>
            <h2 id="update-title"></h2>
            <p class="update-panel__description" id="update-description" role="status"></p>
            <div class="update-panel__meta"><span id="update-checked"></span><a id="update-release-link" href="https://github.com/sganggs/Stronghold-Protocol/releases" target="_blank" rel="noopener noreferrer" hidden></a></div>
          </div>
          <div class="update-panel__actions">
            <button class="button button--quiet" type="button" id="update-check-button"></button>
            <button class="button button--primary" type="button" id="update-apply-button" hidden></button>
          </div>
        </section>

        <section data-admin-page="announcements" hidden class="announcement-admin panel" aria-labelledby="announcement-heading">
          <div class="section-heading">
            <div><p class="eyebrow" id="announcement-kicker"></p><h2 id="announcement-heading"></h2></div>
            <span class="micro" id="announcement-note"></span>
          </div>
          <form class="announcement-form" id="announcement-form">
            <div class="announcement-fields">
              <label class="announcement-field">
                <span id="announcement-title-label"></span>
                <input id="announcement-title-input" name="title" maxlength="80" required>
              </label>
              <label class="announcement-field">
                <span id="announcement-priority-label"></span>
                <select id="announcement-priority-input" name="priority">
                  <option value="normal" id="announcement-normal-option"></option>
                  <option value="urgent" id="announcement-urgent-option"></option>
                </select>
              </label>
              <label class="announcement-field">
                <span id="announcement-audience-label"></span>
                <select id="announcement-audience-input" name="audience">
                  <option value="all" id="announcement-all-audience-option"></option>
                  <option value="new" id="announcement-new-audience-option"></option>
                </select>
              </label>
              <label class="announcement-field">
                <span id="announcement-body-label"></span>
                <textarea id="announcement-body-input" name="body" maxlength="1200" rows="4" required></textarea>
              </label>
            </div>
            <p class="announcement-priority-note" id="announcement-priority-note"></p>
            <div class="announcement-form__actions">
              <p id="announcement-message" role="status" aria-live="polite"></p>
              <button class="button button--primary" type="submit" id="announcement-publish-button"></button>
            </div>
          </form>
          <p class="empty-state" id="announcement-empty" hidden></p>
          <ol class="admin-announcement-list" id="admin-announcement-list"></ol>
        </section>

        <section data-admin-page="display" hidden class="site-settings panel" aria-labelledby="site-settings-heading">
          <div class="section-heading">
            <div><p class="eyebrow" id="site-settings-kicker"></p><h2 id="site-settings-heading"></h2></div>
          </div>
          <form class="site-settings__form" id="site-settings-form">
            <label class="site-settings__field" for="plugin-notice-position">
              <span id="plugin-notice-position-label"></span>
              <select id="plugin-notice-position" name="pluginNoticePosition">
                <option value="right-above-meta" id="plugin-notice-position-right"></option>
                <option value="center-above-copyright" id="plugin-notice-position-center"></option>
                <option value="left-above-actions" id="plugin-notice-position-left"></option>
                <option value="hidden" id="plugin-notice-position-hidden"></option>
              </select>
            </label>
            <p class="site-settings__note" id="site-settings-note"></p>
            <div class="site-settings__actions">
              <p id="site-settings-message" role="status" aria-live="polite"></p>
              <button class="button button--primary" type="submit" id="site-settings-save"></button>
            </div>
          </form>
        </section>

        <section data-admin-page="plugins" hidden class="plugin-admin panel" id="plugin-admin" aria-labelledby="plugin-heading">
          <div class="section-heading">
            <div><p class="eyebrow" id="plugin-kicker"></p><h2 id="plugin-heading"></h2></div>
            <div class="plugin-admin__tools">
              <span class="micro" id="plugin-updated"></span>
              <button class="button button--quiet" type="button" id="plugin-rescan-button"></button>
            </div>
          </div>
          <p class="plugin-security-note" id="plugin-security-note"></p>
          <p class="plugin-security-note"><a href="/" id="plugin-game-link"></a></p>
          <p class="plugin-message" id="plugin-message" role="status" aria-live="polite"></p>

          <div class="plugin-subsection">
            <div class="plugin-subheading">
              <h3 id="installed-plugins-heading"></h3>
              <span class="room-count" id="plugin-count"></span>
            </div>
            <div class="table-wrap">
              <table class="plugin-table">
                <thead><tr>
                  <th id="plugin-th-name"></th><th id="plugin-th-class"></th><th id="plugin-th-version"></th>
                  <th id="plugin-th-status"></th><th id="plugin-th-rooms"></th><th id="plugin-th-check"></th><th id="plugin-th-actions"></th>
                </tr></thead>
                <tbody id="plugin-rows"></tbody>
              </table>
              <p class="empty-state" id="empty-plugins" hidden></p>
            </div>
            <div class="plugin-detail" id="plugin-detail" hidden></div>
          </div>

          <div class="plugin-catalog-grid" hidden>
            <form class="plugin-form" id="plugin-catalog-form">
              <label class="plugin-field" for="plugin-catalog-url"><span id="plugin-catalog-label"></span><input id="plugin-catalog-url" type="url" inputmode="url" autocomplete="url" maxlength="500" placeholder="https://example.org/plugins.json" required></label>
              <p class="plugin-field-note" id="plugin-catalog-note"></p>
              <button class="button button--quiet" type="submit" id="plugin-catalog-button"></button>
            </form>
            <form class="plugin-form" id="plugin-direct-form">
              <label class="plugin-field" for="plugin-zip-url"><span id="plugin-zip-url-label"></span><input id="plugin-zip-url" type="url" inputmode="url" autocomplete="url" maxlength="500" placeholder="https://example.org/plugin.zip" required></label>
              <label class="plugin-field" for="plugin-zip-sha"><span id="plugin-zip-sha-label"></span><input id="plugin-zip-sha" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="64" pattern="[a-f0-9]{64}" required></label>
              <div class="plugin-field-pair">
                <label class="plugin-field" for="plugin-zip-id"><span id="plugin-zip-id-label"></span><input id="plugin-zip-id" type="text" autocomplete="off" spellcheck="false" maxlength="32" pattern="[a-z0-9][a-z0-9-]{1,31}"></label>
                <label class="plugin-field" for="plugin-zip-bytes"><span id="plugin-zip-bytes-label"></span><input id="plugin-zip-bytes" type="number" min="0" max="209715200" step="1"></label>
              </div>
              <p class="plugin-field-note" id="plugin-direct-note"></p>
              <button class="button button--primary" type="submit" id="plugin-install-button"></button>
            </form>
          </div>

          <div class="plugin-subsection plugin-catalog-results" id="plugin-catalog-results" hidden>
            <div class="plugin-subheading"><h3 id="catalog-results-heading"></h3><span class="micro" id="catalog-name"></span></div>
            <div class="table-wrap">
              <table class="plugin-table">
                <thead><tr>
                  <th id="catalog-th-name"></th><th id="catalog-th-class"></th><th id="catalog-th-version"></th>
                  <th id="catalog-th-app"></th><th id="catalog-th-status"></th><th id="catalog-th-actions"></th>
                </tr></thead>
                <tbody id="catalog-rows"></tbody>
              </table>
              <p class="empty-state" id="empty-catalog" hidden></p>
            </div>
          </div>
        </section>

        <section data-admin-page="overview" hidden class="node-section" aria-label="" id="summary-grid">
          <div class="section-heading node-section-heading">
            <div><p class="eyebrow" id="node-kicker"></p><h2 id="node-section-title"></h2></div>
            <span class="node-count" id="node-count"></span>
          </div>
          <article class="node-card">
            <div class="node-card__top">
              <div class="node-identity">
                <span class="node-index">01</span>
                <div>
                  <p class="node-overline" id="node-overline"></p>
                  <h3 id="node-title"></h3>
                </div>
              </div>
              <div class="node-state" id="node-state"><span></span><strong id="node-state-label"></strong></div>
            </div>
            <div class="node-card__body">
              <div class="node-online">
                <span class="node-metric-label" id="online-label"></span>
                <div class="node-online__number"><strong id="online-value">—</strong><span id="online-unit"></span></div>
                <span class="node-metric-foot" id="online-foot"></span>
              </div>
              <div class="node-metrics">
                <div class="node-stat node-stat--gold">
                  <span class="node-metric-label" id="queue-label"></span>
                  <strong id="queue-value">—</strong>
                  <span class="node-metric-foot" id="queue-foot"></span>
                </div>
                <div class="node-stat node-stat--ice">
                  <span class="node-metric-label" id="rooms-label"></span>
                  <strong id="rooms-value">—</strong>
                  <span class="node-metric-foot" id="rooms-foot"></span>
                </div>
                <div class="node-stat node-stat--red">
                  <span class="node-metric-label" id="matches-label"></span>
                  <strong id="matches-value">—</strong>
                  <span class="node-metric-foot" id="matches-foot"></span>
                </div>
              </div>
            </div>
            <div class="node-details" aria-label="" id="node-details">
              <div class="node-detail"><span id="version-label"></span><strong id="app-version">—</strong></div>
              <div class="node-detail"><span id="uptime-label"></span><strong id="app-uptime">—</strong></div>
              <div class="node-detail"><span id="memory-label"></span><strong id="app-memory">—</strong></div>
              <div class="node-detail"><span id="runtime-label"></span><strong id="node-runtime">—</strong></div>
            </div>
            <div class="node-card__bottom">
              <span class="node-endpoint"><span class="endpoint-dot"></span><span id="node-host"></span></span>
              <span class="node-update"><span id="node-updated-label"></span><strong id="updated-at"></strong></span>
            </div>
          </article>
        </section>

        <section data-admin-page="overview" hidden class="resource-section panel" id="resource-section" aria-label="">
          <div class="section-heading">
            <div><p class="eyebrow" id="resource-kicker"></p><h2 id="resource-heading"></h2></div>
            <span class="micro" id="resource-note"></span>
          </div>
          <div class="resource-grid">
            <article class="resource-card resource-card--latency">
              <span class="resource-card__label" id="latency-label"></span>
              <div class="resource-card__figure"><strong id="latency-value">—</strong><span id="latency-unit"></span></div>
              <span class="resource-card__foot" id="latency-foot"></span>
            </article>
            <article class="resource-card">
              <span class="resource-card__label" id="cpu-label"></span>
              <div class="resource-card__figure"><strong id="cpu-value">—</strong><span>%</span></div>
              <div class="resource-meter" id="cpu-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="cpu-bar"></span></div>
              <span class="resource-card__foot" id="cpu-foot"></span>
            </article>
            <article class="resource-card">
              <span class="resource-card__label" id="memory-usage-label"></span>
              <div class="resource-card__figure"><strong id="memory-usage-value">—</strong><span>%</span></div>
              <div class="resource-meter" id="memory-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="memory-bar"></span></div>
              <span class="resource-card__foot" id="memory-usage-foot"></span>
            </article>
            <article class="resource-card">
              <span class="resource-card__label" id="storage-label"></span>
              <div class="resource-card__figure"><strong id="storage-value">—</strong><span>%</span></div>
              <div class="resource-meter" id="storage-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="storage-bar"></span></div>
              <span class="resource-card__foot" id="storage-foot"></span>
            </article>
          </div>
        </section>

        <section data-admin-page="overview" hidden class="panel queue-panel">
          <div class="section-heading">
            <div><p class="eyebrow" id="queue-kicker"></p><h2 id="queue-heading"></h2></div>
            <span class="micro" id="polling-note"></span>
          </div>
          <div class="queue-grid" id="queue-grid"></div>
        </section>

        <section data-admin-page="players" hidden class="panel players-panel">
          <div class="section-heading">
            <div><p class="eyebrow" id="players-kicker"></p><h2 id="players-heading"></h2></div>
            <span class="room-count" id="player-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th id="th-player"></th><th id="th-player-state"></th><th id="th-player-room"></th><th id="th-player-actions"></th>
              </tr></thead>
              <tbody id="player-rows"></tbody>
            </table>
            <p class="empty-state" id="empty-players" hidden></p>
          </div>
        </section>

        <section data-admin-page="rooms" hidden class="panel rooms-panel">
          <div class="section-heading">
            <div><p class="eyebrow" id="rooms-kicker"></p><h2 id="rooms-heading"></h2></div>
            <span class="room-count" id="room-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th id="th-code"></th><th id="th-mode"></th><th id="th-difficulty"></th>
                <th id="th-humans"></th><th id="th-bots"></th><th id="th-spectators"></th><th id="th-round"></th><th id="th-state"></th><th id="th-room-actions"></th>
              </tr></thead>
              <tbody id="room-rows"></tbody>
            </table>
            <p class="empty-state" id="empty-rooms" hidden></p>
          </div>
        </section>
        <section data-admin-page="polls" hidden class="panel polls-panel" id="admin-polls"></section>
        <p class="dashboard-message" id="dashboard-message" role="status"></p>
      </section>
    </main>
    <footer class="admin-footer"><span>STRONGHOLD PROTOCOL</span><span id="footer-caption"></span></footer>
  </div>
</body>
</html>
